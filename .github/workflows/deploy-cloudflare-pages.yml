name: Deploy to Cloudflare Pages

# Two ways to deploy; pick ONE:
#
# A) Cloudflare dashboard git integration (simplest — skip this workflow):
#    https://dash.cloudflare.com → Pages → Create project → Connect to Git
#    Root directory:   frontend
#    Build command:    npm ci && npm run build
#    Output directory: dist
#    Environment var:  VITE_BCAL_MODE = static
#    Cloudflare then watches `main` and auto-deploys on every push.
#
# B) This workflow — runs on GitHub, uploads via the wrangler action. Set:
#    - CLOUDFLARE_API_TOKEN   (repo secret; scope: "Cloudflare Pages: Edit")
#    - CLOUDFLARE_ACCOUNT_ID  (repo secret or variable)
#    You also need to have created the Pages project once in the CF dashboard
#    (so the projectName below matches). No secrets = workflow silently skipped.

# Disabled by default — trigger manually if/when you want CF Pages deploys.
# To re-enable auto-deploy on push, add back `push: { branches: [main] }`.
on:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Only attempt to deploy if the required secret is present; otherwise skip
    # so the workflow doesn't fail noisily on forks or fresh clones.
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' || secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build (static mode)
        run: npm run build
        working-directory: frontend
        env:
          VITE_BCAL_MODE: static

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=bcal --branch=${{ github.ref_name }}
