name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one deployment at a time; skip superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build (static mode, GH Pages subpath)
        run: npm run build
        working-directory: frontend
        env:
          VITE_BCAL_MODE: static
          # Vite emits asset URLs relative to this base path.
          # `/BACL/` matches the repo name so GH Pages serves assets correctly at
          # https://<user>.github.io/BACL/. If you later attach a custom domain
          # (CNAME file), change this to `/`.
          VITE_BASE_PATH: /BACL/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
