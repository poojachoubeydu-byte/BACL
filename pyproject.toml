[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcal"
version = "0.1.0"
description = "BioCompliance Audit Layer — Statistical Evidence Packages for regulated bioinformatics."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "BCAL Contributors"}
]
keywords = [
    "bioinformatics", "compliance", "regulatory", "21-CFR-Part-11",
    "ICH-E9R1", "FDA", "GxP", "audit", "reproducibility", "RNA-seq"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-randomly>=3",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "types-PyYAML",
    "types-python-dateutil",
]
all = ["bcal[pdf,dev]"]

[project.scripts]
bcal = "bcal.cli:app"

[project.urls]
Documentation = "https://github.com/anthropics/bcal"
Source = "https://github.com/anthropics/bcal"
Issues = "https://github.com/anthropics/bcal/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["bcal*"]
exclude = ["tests*", "frontend*", "nextflow*", "snakemake*", "notebooks*"]

[tool.setuptools.package-data]
bcal = [
    "config/*.yaml",
    "config/regulatory_profiles/*.yaml",
    "report/templates/*.j2",
    "report/templates/*.css",
]

# ---------------------------------------------------------------------------
# Ruff (formatter + linter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "notebooks", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",               # isort
    "UP",              # pyupgrade
    "B",               # bugbear
    "C4",              # comprehensions
    "SIM",             # simplify
    "TID",             # tidy imports
    "PL",              # pylint
    "RUF",             # ruff-specific
]
ignore = [
    "PLR0913",  # too many arguments — common in scientific APIs
    "PLR2004",  # magic values — tolerate in tests / thresholds
    "E501",     # line too long — handled by formatter
    "RUF001",   # ambiguous unicode in strings — scientific notation uses × σ ≥ etc.
    "RUF002",   # ambiguous unicode in docstrings
    "RUF003",   # ambiguous unicode in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
# Lazy imports are intentional in the CLI (deferred module loading on subcommands)
# and in pdf_writer (optional WeasyPrint dep).
"bcal/cli.py" = ["PLC0415"]
"bcal/report/pdf_writer.py" = ["PLC0415"]
"bcal/modules/version_lock.py" = ["PLC0415"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = ["frontend", "build", "dist", "notebooks"]

[[tool.mypy.overrides]]
module = [
    "pandas.*", "numpy.*", "scipy.*", "sklearn.*", "statsmodels.*",
    "weasyprint.*", "jinja2.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=bcal",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=75",
]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["bcal"]
omit = ["bcal/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
